# SPDX-License-Identifier: AGPL-3.0-or-later
# Publishes docs/ and the example renders to GitHub Pages (see scripts/build_site.py).
name: Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "examples/output/**", "scripts/build_site.py", "src/cvfacile/__init__.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble site
        env:
          # Settings > Secrets and variables > Actions > Variables
          POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: |
          pip install pillow
          python3 scripts/build_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
